<!doctype html>
<html><head><meta charset="utf-8"><title>acrylic browser test</title>
<style>
  html, body { margin: 0; padding: 0; }
  .pattern { position: absolute; left: 0; top: 0; width: 600px; height: 400px; background: repeating-conic-gradient(#e33 0 25%, #fff 0 50%) 0 0 / 8px 8px; }
  ax-acrylic, ax-surface { position: absolute; width: 200px; height: 100px; --acrylic-tint-opacity: 0; --acrylic-noise-opacity: 0; --acrylic-blur: 12px; --acrylic-saturate: 100%; --acrylic-brightness: 100%; }
  #a { left: 40px; top: 40px; --ax-radius: 24px; }
  #s { left: 300px; top: 40px; --ax-radius: 24px; --ax-corner-shape: bevel; }
</style></head>
<body>
<div class="pattern"></div>
<ax-acrylic id="a"></ax-acrylic>
<ax-surface id="s" layers="acrylic"></ax-surface>
<script type="module" src="./page.ts"></script>
</body></html>
